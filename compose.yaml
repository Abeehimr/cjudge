services:
  judge:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: Dockerfile.judge
    # Rootful Linux only. The inner isolate process drops to a per-box UID.
    cgroup: private
    cap_add: [SYS_ADMIN, SYS_RESOURCE, NET_ADMIN]
    security_opt: [seccomp=unconfined]
    network_mode: none
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m
      - /var/local/lib/isolate:rw,nosuid,nodev,size=16m

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    user: "${CJUDGE_UID:-1000}:${CJUDGE_GID:-1000}"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cjudge
      POSTGRES_USER: cjudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cjudge -d cjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://cjudge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cjudge
      CJUDGE_ALLOWED_HOSTS: ${CJUDGE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CJUDGE_PUBLIC_ORIGIN: ${CJUDGE_PUBLIC_ORIGIN:-https://localhost:8443}
    volumes:
      - credential_keys:/var/lib/cjudge:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  key-init:
    profiles: [setup]
    build:
      context: .
      dockerfile: Dockerfile.api
    user: root
    volumes:
      - credential_keys:/var/lib/cjudge
    command: ["python", "-m", "cjudge.identity", "init-key"]

volumes:
  postgres_data:
  credential_keys:
