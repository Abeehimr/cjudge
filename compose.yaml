services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    user: "${CJUDGE_UID:-1000}:${CJUDGE_GID:-1000}"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cjudge
      POSTGRES_USER: cjudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cjudge -d cjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://cjudge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cjudge
      CJUDGE_ALLOWED_HOSTS: ${CJUDGE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
