services:
  judge:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: Dockerfile.judge
    # Rootful Linux only. The inner isolate process drops to a per-box UID.
    cgroup: private
    cap_add: [SYS_ADMIN, SYS_RESOURCE, NET_ADMIN]
    security_opt: [seccomp=unconfined]
    network_mode: none
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 2048
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m
      - /var/local/lib/isolate:rw,nosuid,nodev,size=16m

  worker:
    profiles: [judging]
    build:
      context: .
      dockerfile: Dockerfile.judge
    cgroup: private
    cap_add: [SYS_ADMIN, SYS_RESOURCE, NET_ADMIN]
    security_opt: [seccomp=unconfined]
    networks: [judge_queue]
    mem_limit: ${CJUDGE_JUDGE_MEMORY_LIMIT:-1g}
    memswap_limit: ${CJUDGE_JUDGE_MEMORY_LIMIT:-1g}
    pids_limit: 2048
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m
      - /var/local/lib/isolate:rw,nosuid,nodev,size=16m
    environment:
      DATABASE_URL: postgresql+psycopg://cjudge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cjudge
      CJUDGE_SANDBOX_INSTANCES: ${CJUDGE_SANDBOX_INSTANCES:-1}
    volumes:
      - task_files:/var/lib/cjudge-tasks:ro
      - submission_files:/var/lib/cjudge-submissions:ro
      - authoring_files:/var/lib/cjudge-authoring
    command: [python, -m, cjudge.judging.worker]
    depends_on: [db]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    user: "${CJUDGE_UID:-1000}:${CJUDGE_GID:-1000}"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]

  db:
    image: postgres:17-alpine
    networks: [default, judge_queue]
    # Up to 32 workers use a listener plus two short-transaction connections each.
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_DB: cjudge
      POSTGRES_USER: cjudge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://cjudge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cjudge
      CJUDGE_ALLOWED_HOSTS: ${CJUDGE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CJUDGE_PUBLIC_ORIGIN: ${CJUDGE_PUBLIC_ORIGIN:-https://localhost:8443}
      CJUDGE_SANDBOX_INSTANCES: ${CJUDGE_SANDBOX_INSTANCES:-1}
    volumes:
      - credential_keys:/var/lib/cjudge:ro
      - task_files:/var/lib/cjudge-tasks
      - lab_files:/var/lib/cjudge-labs
      - submission_files:/var/lib/cjudge-submissions
      - authoring_files:/var/lib/cjudge-authoring
      - export_files:/var/lib/cjudge-exports
    depends_on: [db]

  key-init:
    profiles: [setup]
    build:
      context: .
      dockerfile: Dockerfile.api
    user: root
    volumes:
      - credential_keys:/var/lib/cjudge
    command: ["python", "-m", "cjudge.identity", "init-key"]

volumes:
  postgres_data:
  credential_keys:
  task_files:
  lab_files:
  submission_files:
  authoring_files:
  export_files:

networks:
  judge_queue:
    internal: true
