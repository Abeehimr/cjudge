[project]
name = "cjudge"
version = "0.1.0"
description = "Offline C lab judge"
readme = "README.md"
authors = [
    { name = "Abeehimr", email = "ibraheemkureshi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["alembic>=1.15", "fastapi>=0.115", "psycopg[binary]>=3.2", "sqlalchemy>=2.0", "uvicorn>=0.30"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
cjudge = "cjudge:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
